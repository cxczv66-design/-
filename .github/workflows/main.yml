name: Build IsolateBox APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # يتيح تشغيل البناء يدوياً بضغطة زر من تبويب Actions في GitHub

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java 17 المتوافقة مع أندرويد
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. إعداد أداة Gradle والتخزين المؤقت لتسريع البناء
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. تجهيز ملفات التكوين والبيئة
      - name: Ensure .env and .env.example exist
        run: |
          touch .env
          if [ ! -f .env.example ]; then
            echo "# Placeholder for CI build" > .env.example
          fi

      # 5. منح صلاحيات التنفيذ لـ gradlew
      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      # 6. بناء نسخة التطوير (Debug APK)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 7. رفع ملف الـ APK الناتج كأصل (Artifact) للتحميل المباشر
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IsolateBox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # 8. محاولة بناء نسخة الإنتاج (Release APK)
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace || true

      - name: Upload Release APK (if built)
        uses: actions/upload-artifact@v4
        with:
          name: IsolateBox-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 14

      # 9. إنشاء إصدار رسمي (Release) عند دفع Tag جديد مثل v1.0.0
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
